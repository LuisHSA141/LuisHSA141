<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="260" viewBox="0 0 860 260"><style>
text{font-family:'Courier New',Courier,monospace;}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.55}43%{opacity:1}77%{opacity:1}78%{opacity:.7}79%{opacity:1}}
.scan{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" y="3" fill="#000" opacity=".45"/></pattern>
<pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="26" fill="#fff" opacity=".03"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9db0" stop-opacity="0"/><stop offset=".5" stop-color="#2a9db0" stop-opacity=".18"/><stop offset="1" stop-color="#2a9db0" stop-opacity="0"/></linearGradient>
<filter id="tint"><feColorMatrix type="matrix" values="0 0 0 0 .16  0 0 0 0 .62  0 0 0 0 .69  0 0 0 1 0"/></filter>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
</defs><rect width="860" height="260" fill="#030809"/>
<rect x="10" y="10" width="840" height="240" fill="#061012" stroke="#18363b"/>
<path d="M28 10H10V28" fill="none" stroke="#2a9db0" stroke-width="2"/><path d="M832 10H850V28" fill="none" stroke="#2a9db0" stroke-width="2"/><path d="M28 250H10V232" fill="none" stroke="#2a9db0" stroke-width="2"/><path d="M832 250H850V232" fill="none" stroke="#2a9db0" stroke-width="2"/>
<text x="30" y="38" font-size="12" fill="#2a9db0" letter-spacing="2">141 // OPERATOR FILE</text>
<text x="830" y="38" font-size="12" fill="#8ae8f5" text-anchor="end" letter-spacing="2" class="blink">● SIGNAL: UNSTABLE</text>
<line x1="30" y1="48" x2="830" y2="48" stroke="#1f454b" stroke-dasharray="2 4"/>
<g transform="translate(130,144)">
  <rect x="-86" y="-84" width="172" height="168" fill="none" stroke="#1f454b"/>
  <circle r="62" fill="none" stroke="#1f454b" stroke-width="1.5"/>
  <circle r="46" fill="none" stroke="#2a9db0" stroke-width="1" stroke-dasharray="3 5" class="pulse"/>
  <path d="M0 -78V-52M0 52V78M-78 0H-52M52 0H78" stroke="#2a9db0" stroke-width="2"/>
  <text y="14" font-size="40" font-weight="bold" fill="#d6e2e3" text-anchor="middle" letter-spacing="2" class="flicker">LH</text>
</g>
<text x="248" y="88" font-size="12" fill="#a9babc" letter-spacing="3">ID DO OPERADOR</text>
<text x="246" y="132" font-size="44" font-weight="bold" fill="#d6e2e3" letter-spacing="4" class="flicker">LUISHSA141</text>
<rect x="248" y="146" width="210" height="3" fill="#2a9db0"/>
<text x="248" y="178" font-size="14" fill="#8fd3de" letter-spacing="1">CODINOME: LUIS</text>
<text x="248" y="200" font-size="14" fill="#a9babc" letter-spacing="1">FOCO: WEB // MOBILE</text>
<text x="248" y="222" font-size="14" fill="#a9babc" letter-spacing="1">ACCESS: <tspan fill="#2a9db0" font-weight="bold">GRANTED</tspan><tspan class="blink" fill="#d6e2e3"> _</tspan></text>
<g font-size="11" fill="#a9babc" text-anchor="end" letter-spacing="1">
  <text x="830" y="178">STACK: JS // HTML // CSS</text>
  <text x="830" y="200">CLASSE: DEV</text>
  <text x="830" y="222">STATUS: <tspan fill="#8ae8f5" class="pulse">DISPONÍVEL</tspan></text>
</g>
<rect width="860" height="260" fill="url(#hatch)"/>
<rect class="scan" style="--h:300px" width="860" height="40" fill="url(#bar)"/>
<rect width="860" height="260" fill="url(#sl)"/>
<rect width="860" height="260" fill="url(#vig)"/>
</svg>