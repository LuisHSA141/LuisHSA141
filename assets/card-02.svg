<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="150" viewBox="0 0 860 150"><style>
text{font-family:'Courier New',Courier,monospace;}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:1}41%{opacity:1}42%{opacity:.55}43%{opacity:1}77%{opacity:1}78%{opacity:.7}79%{opacity:1}}
.scan{animation:scan 5s linear infinite}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(var(--h))}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style><defs>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" y="3" fill="#000" opacity=".45"/></pattern>
<pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="26" fill="#fff" opacity=".03"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a9db0" stop-opacity="0"/><stop offset=".5" stop-color="#2a9db0" stop-opacity=".18"/><stop offset="1" stop-color="#2a9db0" stop-opacity="0"/></linearGradient>
<filter id="tint"><feColorMatrix type="matrix" values="0 0 0 0 .16  0 0 0 0 .62  0 0 0 0 .69  0 0 0 1 0"/></filter>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
</defs><rect width="860" height="150" fill="#030809"/>
<rect x="8" y="8" width="844" height="134" fill="#061012" stroke="#18363b"/>
<path d="M20 8H8V20" fill="none" stroke="#2a9db0" stroke-width="2"/><path d="M840 8H852V20" fill="none" stroke="#2a9db0" stroke-width="2"/><path d="M20 142H8V130" fill="none" stroke="#2a9db0" stroke-width="2"/><path d="M840 142H852V130" fill="none" stroke="#2a9db0" stroke-width="2"/>
<rect x="8" y="8" width="5" height="134" fill="#2a9db0"/>
<text x="40" y="36" font-size="11" fill="#2a9db0" letter-spacing="2">ARQUIVO 02 // OPERATOR MODULE</text>
<text x="40" y="70" font-size="26" font-weight="bold" fill="#d6e2e3" letter-spacing="3" class="flicker">FICHA 141</text>
<text x="40" y="98" font-size="13" fill="#a9babc">▸ Ficha de operador digital, na web e como app Android</text><text x="40" y="118" font-size="13" fill="#a9babc">▸ Inventário em grade, ferimentos por parte do corpo, temas CRT</text>
<g text-anchor="end" font-size="11" letter-spacing="1">
  <text x="828" y="36" fill="#2a9db0"><tspan class="pulse">●</tspan> STATUS: ONLINE</text>
  <text x="828" y="122" fill="#8fd3de">ficha141.vercel.app ➤</text>
</g>
<rect width="860" height="150" fill="url(#hatch)"/>
<rect class="scan" style="--h:190px" width="860" height="40" fill="url(#bar)"/>
<rect width="860" height="150" fill="url(#sl)"/>
<rect width="860" height="150" fill="url(#vig)"/>
</svg>